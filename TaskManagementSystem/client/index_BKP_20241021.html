<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JVTC Training Links - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #090b09;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
        }
        .login-container button:hover {
            background-color: #3f413f;
        }
        .login-container .message {
            margin-top: 10px;
            color: #777;
        }
        .login-container .role {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login to JVTC Training Links</h2>
        <form onsubmit="handleLogin(event)">
            <div class="role">
                <label>
                    <input type="radio" name="role" value="admin" checked /> Admin
                </label>
                <label>
                    <input type="radio" name="role" value="employee" /> Employee
                </label>
            </div>
            <input type="text" name="username" id="username" placeholder="Username" required />
            <input type="password" name="password" id="password" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        async function handleLogin(event) { 
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch('/api/login-credentials', {
                    method: 'GET', // Change to POST for security
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password }) // Send credentials
                });

                if (response.ok) {
                    const result = await response.json();
                    // Check if the username and password match
                    const user = result.find(user => user.Username === username && user.Password === password);
                    
                    if (user) {
                        window.location.href = './menu.html'; // Redirect to menu page
                    } else {
                        alert('Invalid username or password.');
                    }
                } else {
                    alert('Invalid username or password.');
                }
            } catch (error) {
                console.error('Error during login:', error);
                alert('An error occurred. Please try again later.');
            }
        }
    </script>
</body>
</html>
