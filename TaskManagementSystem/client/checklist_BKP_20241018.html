<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Checklist</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: white;
        }

        h1 {
            color: #090909;
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #ece8e8;
            color: black;
        }

        td:nth-child(1) {
            width: 50px;
        }

        td:nth-child(5) {
            width: 30px;
        }

        td:nth-child(6) {
            width: 120px;
        }

        td button {
            padding: 10px 15px;
            background-color: #ece8e8;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        td button:hover {
            background-color: #c7c4c4;
        }

        td button:disabled {
            background-color: #ece8e8;
            cursor: not-allowed;
        }

        .delete-button {
            cursor: pointer;
            background: none;
            border: none;
            color: red;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Task Checklist</h1>

    <table id="taskTable">
        <thead>
            <tr>
                <th>Sr No.</th>
                <th>Task Name</th>
                <th>Assigned to</th>
                <th>Task Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="taskTableBody">
        </tbody>
    </table>

    <button onclick="addRow()">Add Row</button>

    <script>
        const employee = ["Krishna", "Bhavesh",];
        const statuses = ["Pending", "Completed"];

        function addRow() {
            const table = document.getElementById("taskTable").getElementsByTagName('tbody')[0];
            const rowCount = table.rows.length + 1;
            const newRow = table.insertRow();

            const cell1 = newRow.insertCell(0);
            const cell2 = newRow.insertCell(1);
            const cell3 = newRow.insertCell(2);
            const cell4 = newRow.insertCell(3);
            const cell5 = newRow.insertCell(4);

            cell1.innerHTML = rowCount;
            cell2.innerHTML = `<input type="text" placeholder="Enter task name">`;
            
            let assignedDropdown = `<select>`;
            employee.forEach(employee => {
                assignedDropdown += `<option value="${employee}">${employee}</option>`;
            });
            assignedDropdown += `</select>`;
            cell3.innerHTML = assignedDropdown;

            let statusDropdown = `<select>`;
            statuses.forEach(status => {
                statusDropdown += `<option value="${status}">${status}</option>`;
            });
            statusDropdown += `</select>`;
            cell4.innerHTML = statusDropdown;

            cell5.innerHTML = `
                <button onclick="saveTask(this)">Save</button>
                <button onclick="editTask(this)" disabled>Edit</button>
                <button class="delete-button" onclick="deleteRow(this)">🗑️</button>
            `;
        }

        function deleteRow(button) {
            const row = button.parentNode.parentNode;
            console.log('row=' +row);
            let x = 'gg';
            console.log(row);
            const taskId = row.dataset.id; // Assuming the row has a data-id attribute with the task ID
            console.log('taskId=' +taskId);
            
            const confirmDelete = confirm("Are you sure you want to delete this task?");
            console.log(confirmDelete);
            console.log(`gg ${x}`)
            if (confirmDelete) {
                fetch(`http://localhost:3006/api/tasks/${taskId}`, {
                    method: 'DELETE',
                })
                .then(response => {
                    if (response.ok) {
                        row.parentNode.removeChild(row);
                        console.log("Task deleted successfully");
                    } else {
                        console.error("Failed to delete task");
                    }
                })
                .catch(error => console.error("Error:", error));
            }
        }

        function saveTask(button) {
            const row = button.parentNode.parentNode;
            const taskName = row.cells[1].querySelector("input").value;
            const assignedTo = row.cells[2].querySelector("select").value;
            const taskStatus = row.cells[3].querySelector("select").value;

            fetch('http://localhost:3006/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ taskName, assignedTo, taskStatus })
            })
            .then(response => {
                if (response.ok) {
                    button.disabled = true;
                    row.cells[4].querySelector("button:nth-child(2)").disabled = false; 
                    console.log("Task saved successfully");
                } else {
                    console.error("Failed to save task");
                }
            });
        }

        function editTask(button) {
            const row = button.parentNode.parentNode;
            row.cells[1].querySelector("input").disabled = false;
            row.cells[2].querySelector("select").disabled = false;
            row.cells[3].querySelector("select").disabled = false;
            row.cells[4].querySelector("button:nth-child(1)").disabled = false;  
            button.disabled = true;
        }

        async function fetchTasks() {
            try {
                const response = await fetch('http://localhost:3006/api/tasks');
                if (!response.ok) throw new Error('Network response was not ok');
                const tasks = await response.json();

                const taskTableBody = document.getElementById('taskTableBody');
                taskTableBody.innerHTML = '';

                tasks.forEach((task, index) => {
                    const row = document.createElement('tr');
                    row.dataset.id = task.id;
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td><input type="text" value="${task.TaskName}" disabled></td>
                        <td>
                            <select disabled>
                                ${employee.map(employee => `
                                    <option value="${employee}" ${task.AssignedTo === employee ? 'selected' : ''}>${employee}</option>
                                `).join('')}
                            </select>
                        </td>
                        <td>
                            <select disabled>
                                ${statuses.map(status => `
                                    <option value="${status}" ${task.TaskStatus === status ? 'selected' : ''}>${status}</option>
                                `).join('')}
                            </select>
                        </td>
                        <td>
                            <button onclick="saveTask(this)" disabled>Save</button>
                            <button onclick="editTask(this)">Edit</button>
                            <button class="delete-button" onclick="deleteRow(this)">🗑️</button>
                        </td>
                    `;
                    taskTableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching tasks:', error);
            }
        }

        fetchTasks();
    </script>
</body>
</html>
